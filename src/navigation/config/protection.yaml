command_gate:
  command_timeout: 0.35
  scan_timeout: 0.6
  max_linear_speed: 0.15
  max_angular_speed: 0.8
collision_monitor:
  use_sim_time: true
  cmd_vel_in_topic: cmd_vel_guard_input
  cmd_vel_out_topic: cmd_vel
  # The laser mount is static; avoid waiting for future odometry during shutdown.
  transform_tolerance: 0.0
  source_timeout: 0.6
  base_shift_correction: false
  stop_pub_timeout: 1.0
  polygons: [StopZone, SlowZone]
  StopZone:
    type: polygon
    points: [0.27, 0.22, 0.27, -0.22, -0.25, -0.22, -0.25, 0.22]
    action_type: stop
    max_points: 1
    visualize: true
    polygon_pub_topic: stop_zone
  SlowZone:
    type: polygon
    points: [0.5, 0.28, 0.5, -0.28, -0.32, -0.28, -0.32, 0.28]
    action_type: slowdown
    max_points: 1
    slowdown_ratio: 0.4
    visualize: true
    polygon_pub_topic: slow_zone
  observation_sources: [scan]
  scan:
    type: scan
    topic: scan
