command_gate:
  command_timeout: 0.35
  scan_timeout: 0.6
  max_linear_speed: 0.15
  max_angular_speed: 0.8
# Independent final guard: footprint + 2 cm. lidar_safety uses a larger swept margin.
monitor_margin: 0.02
collision_monitor:
  use_sim_time: true
  cmd_vel_in_topic: cmd_vel_guard_input
  cmd_vel_out_topic: cmd_vel
  # The laser mount is static; avoid waiting for future odometry during shutdown.
  transform_tolerance: 0.0
  source_timeout: 0.6
  base_shift_correction: false
  stop_pub_timeout: 1.0
  polygons: [StopZone]
  StopZone:
    type: polygon
    # points are derived from lidar_safety's footprint by protection.launch.py.
    action_type: stop
    max_points: 0
    visualize: true
    polygon_pub_topic: stop_zone
  observation_sources: [scan]
  scan:
    type: scan
    topic: scan
