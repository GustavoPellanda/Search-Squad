# Adapted classroom/Burger parameters; attribution in THIRD_PARTY.md.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    # Allow action cancellation to finish under simulation load before reporting an error:
    default_server_timeout: 1000
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # A new LiDAR obstacle must allow the 1 Hz route replanner to run before aborting:
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    - observation_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      # Slow protected turns still make progress even while the center stays fixed:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Keep this below the 0.10 m minimum lookahead: RPP uses the carrot distance
      # to switch from route tracking to final-heading alignment in Humble.
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.25
    observation_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      # Retain the viewpoint's clearance instead of stopping 10 cm short at a corner:
      xy_goal_tolerance: 0.04
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.14
      lookahead_dist: 0.25
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.25
      lookahead_time: 1.5
      # Slow tight curves should follow nearby path cells instead of cutting the corner:
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.55
      rotate_to_heading_min_angle: 0.6
      use_rotate_to_heading: true
      # Rim acceleration is 0.256 m/s^2, below the drive's 1.0 m/s^2 actuator ramp.
      # Sufficient angular acceleration also avoids stalling in protected slow turns:
      max_angular_accel: 3.2
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.06
      # lidar_safety already applies a separate near-obstacle speed reduction:
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      use_interpolation: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Humble StaticLayer reads these parameters from its costmap node:
      lethal_cost_threshold: 65
      trinary_costmap: true
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.5
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: indoor_navigation::LiveObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 3.4
          obstacle_min_range: 0.12
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      always_send_full_costmap: true
      # The circular planning footprint contains the final StopZone at every yaw.
      # This also leaves room for in-place LiDAR observation turns near furniture:
      robot_radius: 0.35
      footprint_padding: 0.01
      filters:
      - room_filter
      # Inflate the combined map, including new room-mask edges, before planning:
      - inflation_layer
      room_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: room_filter_info
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      lethal_cost_threshold: 65
      trinary_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      obstacle_layer:
        plugin: indoor_navigation::LiveObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          inf_is_valid: true
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.12
          obstacle_max_range: 3.4
          obstacle_min_range: 0.12
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
      always_send_full_costmap: true
      robot_radius: 0.35
      footprint_padding: 0.01
      filters:
      - room_filter
      - inflation_layer
      room_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: room_filter_info
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.12
      use_astar: false
      allow_unknown: false
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2
